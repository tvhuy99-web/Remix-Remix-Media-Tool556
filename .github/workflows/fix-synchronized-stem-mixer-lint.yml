name: Fix synchronized stem mixer lint

on:
  push:
    branches:
      - agent/stem-quality-hardening
    paths:
      - scripts/fix_synchronized_stem_mixer_lint.py
      - .github/workflows/fix-synchronized-stem-mixer-lint.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/fix_synchronized_stem_mixer_lint.py
      - .github/workflows/fix-synchronized-stem-mixer-lint.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stem-quality-hardening
          fetch-depth: 0

      - name: Apply guarded lint fix
        run: python3 scripts/fix_synchronized_stem_mixer_lint.py

      - name: Verify project structure
        run: python3 scripts/verify_project.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/mediatool/core/audio/SynchronizedStemMixer.kt
          git diff --cached --check
          git commit -m "Để AudioTrack tự tạo session phát"
          git push origin HEAD:agent/stem-quality-hardening
