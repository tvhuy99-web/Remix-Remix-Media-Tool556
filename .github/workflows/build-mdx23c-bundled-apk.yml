name: Build MDX23C bundled APK

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - docs/**
      - scripts/apply_mdx23c_tuning_modes.py
      - .github/workflows/build-mdx23c-bundled-apk.yml

permissions:
  contents: write

concurrency:
  group: build-mdx23c-bundled-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply guarded tuning patch
        if: ${{ hashFiles('scripts/apply_mdx23c_tuning_modes.py') != '' }}
        run: python3 scripts/apply_mdx23c_tuning_modes.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable CI signing key
        run: |
          mkdir -p .ci
          keytool -genkeypair -v \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=MediaTool CI,O=MediaTool,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Verify and test source
        run: |
          python3 scripts/verify_project.py
          ./gradlew testDebugUnitTest --stacktrace

      - name: Commit tuning modes
        if: ${{ hashFiles('scripts/apply_mdx23c_tuning_modes.py') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs
          git rm scripts/apply_mdx23c_tuning_modes.py
          git diff --cached --check
          git commit -m "Thêm chế độ hiệu năng MDX23C"
          git push origin HEAD:agent/mdx23c-vocal-onnx

      - name: Download private MDX23C release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/models
          gh release download mdx23c-vocal-personal-v1 \
            --pattern mdx23c-vocals-core.onnx \
            --dir app/src/main/assets/models
          echo "8925ece1f0da006d342856f93e75ba2dea9058d44c286c4cd6a98a41c67367bb  app/src/main/assets/models/mdx23c-vocals-core.onnx" \
            | sha256sum --check --strict
          test "$(stat -c %s app/src/main/assets/models/mdx23c-vocals-core.onnx)" = "448152790"

      - name: Build bundled APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify model is inside APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F "assets/models/mdx23c-vocals-core.onnx"
          test "$(unzip -p "$APK" assets/models/mdx23c-vocals-core.onnx | sha256sum | cut -d' ' -f1)" = \
            "8925ece1f0da006d342856f93e75ba2dea9058d44c286c4cd6a98a41c67367bb"

      - name: Split APK for artifact transport
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/mdx23c-apk-parts
          sha256sum "$APK" | sed 's#  .*#  MediaTool-MDX23C-bundled-debug.apk#' \
            > /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.sha256
          stat -c '%s' "$APK" > /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.bytes
          split -b 300M -d -a 2 "$APK" /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.part-
          test -f /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.part-00
          test -f /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.part-01

      - name: Upload APK part 00
        uses: actions/upload-artifact@v4
        with:
          name: MediaTool-MDX23C-bundled-part-00
          path: /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.part-00
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload APK part 01
        uses: actions/upload-artifact@v4
        with:
          name: MediaTool-MDX23C-bundled-part-01
          path: /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.part-01
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: MediaTool-MDX23C-bundled-checksum
          path: |
            /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.sha256
            /tmp/mdx23c-apk-parts/MediaTool-MDX23C-bundled-debug.apk.bytes
          if-no-files-found: error
          retention-days: 30
