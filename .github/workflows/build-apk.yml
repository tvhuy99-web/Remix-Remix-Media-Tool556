name: Build app-debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply final PCM diagnostics
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if test -f app/src/main/java/com/aistudio/mediatool/core/spatial/PcmStereoAnalyzer.kt; then
            echo "Final PCM diagnostics already applied"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-final-pcm-diagnostics.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          raw_lines = workflow[start:end].splitlines()
          source = []
          in_triple = False
          for raw in raw_lines:
              line = raw[10:] if raw.startswith("          ") else raw
              if in_triple and line.strip() not in {"'''", '\"\"\"'}:
                  line = "          " + line
              source.append(line)
              if (line.count("'''") + line.count('\"\"\"')) % 2 == 1:
                  in_triple = not in_triple
          code = "\n".join(source)
          exec(compile(code, 'apply-final-pcm-diagnostics', 'exec'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/mediatool/core/spatial/SpatialAudioEngine.kt \
                  app/src/main/java/com/aistudio/mediatool/core/spatial/PcmStereoAnalyzer.kt \
                  app/src/test/java/com/aistudio/mediatool/core/spatial/PcmStereoAnalyzerTest.kt
          git commit -m "fix diagnostics to measure final stereo PCM"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify project
        run: python3 scripts/verify_project.py

      # Slow legacy tasks intentionally excluded: assembleInternal, assembleDebugAndroidTest.
      - name: Build app-debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --build-cache

      - name: Inspect app-debug APK
        run: |
          python3 scripts/inspect_apks.py app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Lint and unit tests for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace --build-cache

      - name: Upload app-debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload pull-request reports
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mediatool-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 3
