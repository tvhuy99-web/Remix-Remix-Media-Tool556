name: Validate and publish room presence v3 APK

on:
  pull_request:
    branches: [agent/spatial-object-renderer-v2]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: room-presence-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-publish:
    if: github.event.pull_request.head.ref == 'agent/spatial-room-presence-front-back-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply patch when not committed yet
        run: |
          if grep -q 'kEarlyReflectionMaxGain = 0.34f' app/src/main/cpp/room_aware_spatial_jni.cpp; then
            echo 'Production patch is already present.'
          else
            python3 scripts/apply_room_presence_front_back_v3.py
          fi

      - name: Verify architecture markers
        run: |
          grep -q 'renderEarlyReflectionSample' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'kEarlyReflectionMaxGain = 0.34f' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'kRearDirectLowpassHz = 4200.0f' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'kReflectionLowpassHz = 7200.0f' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'maxReflectionWet = 0.46f' app/src/main/java/com/aistudio/mediatool/core/spatial/SpatialRoomPreset.kt
          grep -q 'class SpatialRoomPresenceTuningTest' app/src/test/java/com/aistudio/mediatool/core/spatial/SpatialRoomPresenceTuningTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build, lint and unit test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace --build-cache

      - name: Inspect APK native payload and signature
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          python3 scripts/inspect_apks.py "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Commit validated production changes and remove scaffolding
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/test docs/ROOM_PRESENCE_V3_TEST_NOTES.md
          for path in \
            .github/workflows/apply-room-presence-front-back-v3.yml \
            .github/workflows/validate-publish-room-presence-v3.yml \
            .github/ROOM_PRESENCE_V3_SCOPE.txt \
            scripts/apply_room_presence_front_back_v3.py \
            scripts/patch_spatial_room_presence_v3.py \
            docs/ROOM_PRESENCE_V3_IMPLEMENTATION.md \
            docs/ROOM_PRESENCE_V3_CHANGELOG.md \
            docs/ROOM_PRESENCE_V3_README.md \
            docs/ROOM_PRESENCE_V3_DEVICE_CHECKLIST.md \
            docs/ROOM_PRESENCE_V3_STATUS.md \
            docs/ROOM_PRESENCE_V3_CI.md; do
            if [ -e "$path" ]; then git rm -f "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Strengthen clean room presence and front-back cues'
            git push origin "HEAD:$BRANCH"
          fi

      - name: Publish one verified Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          TAG='spatial-room-presence-v3-pr34-latest'
          APK_NAME='MediaTool-room-presence-front-back-v3-pr34.apk'
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          APK_BYTES="$(stat -c '%s' "$APK_NAME")"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"

          existing_release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$existing_release_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$existing_release_id"
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          cat > release-notes.md <<EOF
          APK kiểm thử Room Presence và Front/Back v3 từ PR #34.

          Source commit: ${SOURCE_SHA}
          Dung lượng: ${APK_BYTES} byte
          SHA-256: ${APK_SHA256}

          Thay đổi chính:
          - cụm early reflections xác định tạo cảm giác phòng sạch;
          - late ray-traced tail tối hơn, gate mạnh hơn và 12.288 rays;
          - trần room presence và đường cong slider mạnh hơn;
          - front/back nằm ngang, rear low-pass 4,2 kHz và wet phía sau rõ hơn;
          - diagnostics mới cho early reflection và rear cue.

          Đây là debug APK để kiểm thử thiết bị, chưa hợp nhất vào main.
          EOF

          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "Room Presence + Front/Back v3 PR #34 • latest (${SHORT_SHA})" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
          gh release upload "$TAG" "$APK_NAME" --clobber

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$TAG" --pattern "$APK_NAME" --dir "$verify_dir"
          downloaded_sha="$(sha256sum "$verify_dir/$APK_NAME" | cut -d' ' -f1)"
          test "$downloaded_sha" = "$APK_SHA256"

          gh pr comment "${{ github.event.pull_request.number }}" --body "Build thiết bị v3 đã xác minh. Asset: \`$APK_NAME\`, bytes: \`$APK_BYTES\`, SHA-256: \`$APK_SHA256\`, source: \`$SOURCE_SHA\`."

          {
            echo '## Room Presence + Front/Back v3 APK'
            echo
            echo "- Source: $SOURCE_SHA"
            echo "- Asset: $APK_NAME"
            echo "- Bytes: $APK_BYTES"
            echo "- SHA-256: $APK_SHA256"
            echo '- Download verification: passed'
          } | tee -a "$GITHUB_STEP_SUMMARY"
