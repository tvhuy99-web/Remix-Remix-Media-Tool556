name: Build app-debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify project
        run: python3 scripts/verify_project.py

      # Slow legacy tasks intentionally excluded: assembleInternal, assembleDebugAndroidTest.
      - name: Build app-debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --build-cache

      - name: Inspect app-debug APK
        run: |
          python3 scripts/inspect_apks.py app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Lint and unit tests for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace --build-cache

      - name: Publish Spatial Audio test APK as draft prerelease
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/spatial-audio-engine'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          TAG="spatial-audio-pr26-${SHORT_SHA}"
          APK="MediaTool-spatial-audio-pr26-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          APK_BYTES="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          cat > spatial-release-notes.md <<EOF
          Draft APK kiểm thử cho PR #26, nhánh agent/spatial-audio-engine.

          Head: ${HEAD_SHA}
          Dung lượng: ${APK_BYTES} byte
          SHA-256: ${APK_SHA256}

          Đã xác minh trong cùng workflow:
          - CMake/NDK ARM64
          - libphonon.so và libmediatool_spatial.so trong APK
          - chữ ký APK v2
          - Android Lint
          - toàn bộ unit test

          Chưa hợp nhất vào main. Chỉ dùng để kiểm thử Spatial Audio trên thiết bị.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$HEAD_SHA" \
              --title "Spatial Audio PR #26 • ${SHORT_SHA}" \
              --notes-file spatial-release-notes.md \
              --draft \
              --prerelease
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "SPATIAL_APK_TAG=$TAG" >> "$GITHUB_ENV"
          echo "SPATIAL_APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "SPATIAL_APK_BYTES=$APK_BYTES" >> "$GITHUB_ENV"

      # Artifact quota must never prevent code, lint, unit-test, or draft-release validation.
      - name: Upload app-debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload pull-request reports
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mediatool-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
