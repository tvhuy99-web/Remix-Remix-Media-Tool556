name: Refine Spatial Audio Stereo Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/spatial-audio-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Spatial Audio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply stereo, loudness, diagnostics and simple UI refinement
        run: |
          python3 scripts/refine_spatial_audio_v2_stage2.py
          python3 scripts/refine_spatial_audio_v2.py
          rm -f scripts/refine_spatial_audio_v2.py
          rm -f scripts/refine_spatial_audio_v2_stage2.py
          rm -f .github/workflows/refine-spatial-audio-v2-once.yml

      - name: Commit refinement
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No refinement changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Spatial Audio stereo loudness and simple controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
