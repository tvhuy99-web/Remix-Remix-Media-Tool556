name: Apply content picker cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply guarded source transform
        run: python3 scripts/apply_content_picker_cleanup.py

      - name: Verify transformed source
        run: |
          python3 scripts/verify_project.py
          ./scripts/run_core_smoke.sh

      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/mediatool/ui/screens/OtherScreen.kt \
                  app/src/main/java/com/aistudio/mediatool/ui/screens/MixScreen.kt \
                  scripts/apply_content_picker_cleanup.py \
                  .github/workflows/apply-content-picker-cleanup.yml
          git commit -m "ui: finish content picker cleanup"
          git push origin HEAD:${{ github.head_ref }}
