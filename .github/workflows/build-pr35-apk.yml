name: Build PR35 APK with stable signature

on:
  push:
    branches:
      - build/pr35-apk-4989257

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Report stable-signature build start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "<!-- pr35-apk-stable-signature-start:4989257 --> Đang build lại APK PR #35 bằng khóa ký CI ổn định đã dùng cho PR #34. Commit sản phẩm: \`49892576e81f6616dd22f58f3e862f795b69946a\`. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout exact PR35 product commit
        uses: actions/checkout@v4
        with:
          ref: 49892576e81f6616dd22f58f3e862f795b69946a
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          mkdir -p .ci
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list -v \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey | tee /tmp/stable-signing-cert.txt
          grep -q 'SHA256:' /tmp/stable-signing-cert.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project
        run: |
          chmod +x gradlew
          python3 scripts/verify_project.py

      - name: Test, lint, and build APK
        env:
          GITHUB_SHA: 49892576e81f6616dd22f58f3e862f795b69946a
          GITHUB_HEAD_REF: agent/spatial-room-production-fix
          GITHUB_REF_NAME: agent/spatial-room-production-fix
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --build-cache

      - name: Verify APK signature and native payload
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="MediaTool-spatial-room-production-pr35-4989257-stable-signed.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"
          unzip -l "dist/$APK_NAME" | grep -E 'lib/arm64-v8a/(libphonon|libmediatool_spatial)\.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "dist/$APK_NAME" | tee "dist/$APK_NAME.cert.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "dist/$APK_NAME.cert.txt"

      - name: Publish stable-signature prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pr35-spatial-room-production-4989257-stable-signature"
          APK_NAME="MediaTool-spatial-room-production-pr35-4989257-stable-signed.apk"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "dist/$APK_NAME" \
            "dist/$APK_NAME.sha256" \
            "dist/$APK_NAME.cert.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target 49892576e81f6616dd22f58f3e862f795b69946a \
            --title "Spatial Room Production PR #35 • stable signature • 4989257" \
            --notes "APK này thay thế bản PR #35 phát hành trước đó. Nó được build từ cùng commit sản phẩm 49892576e81f6616dd22f58f3e862f795b69946a nhưng dùng khóa ký CI ổn định đã được dùng cho APK PR #34, nhằm cho phép cài đè mà không gỡ ứng dụng. Đã chạy verify_project, unit tests, lintDebug, assembleDebug, xác minh APK Signature Scheme v2 và kiểm tra hai thư viện native arm64-v8a." \
            --prerelease

      - name: Report successful stable-signature release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr35-spatial-room-production-4989257-stable-signature"
          APK_NAME="MediaTool-spatial-room-production-pr35-4989257-stable-signed.apk"
          CHECKSUM="$(cut -d ' ' -f1 "dist/$APK_NAME.sha256")"
          CERT_SHA256="$(grep 'Signer #1 certificate SHA-256 digest:' "dist/$APK_NAME.cert.txt" | sed 's/.*digest: //')"
          cat > /tmp/pr35-stable-signature-comment.md <<EOF
          <!-- pr35-apk-stable-signature:4989257 -->
          ## APK PR #35 dùng chữ ký ổn định đã sẵn sàng

          - Commit sản phẩm: \`49892576e81f6616dd22f58f3e862f795b69946a\`
          - Tệp: \`$APK_NAME\`
          - SHA-256 APK: \`$CHECKSUM\`
          - SHA-256 chứng thư ký: \`$CERT_SHA256\`
          - Tải APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME
          - Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG
          - Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Bản này dùng lại khóa ký CI ổn định của PR #34 và thay thế APK PR #35 phát hành trước đó, vốn bị Android báo xung đột chữ ký.
          EOF
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr35-stable-signature-comment.md

      - name: Report stable-signature release failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "<!-- pr35-apk-stable-signature-failed:4989257 --> Build APK PR #35 bằng chữ ký ổn định chưa hoàn tất. Xem workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
