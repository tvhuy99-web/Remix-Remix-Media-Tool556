name: Publish Spatial object renderer v2 APK

on:
  pull_request:
    branches: [agent/room-aware-spatial-audio-hardening-v2]

permissions:
  contents: write

concurrency:
  group: publish-spatial-object-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-apk:
    if: github.event.pull_request.head.ref == 'agent/spatial-object-renderer-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout object renderer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build object renderer APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --build-cache

      - name: Inspect and verify APK
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          python3 scripts/inspect_apks.py "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Publish one verified Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          TAG='spatial-object-renderer-pr33-latest'
          APK_NAME='MediaTool-spatial-object-renderer-pr33.apk'
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          APK_BYTES="$(stat -c '%s' "$APK_NAME")"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"

          existing_release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$existing_release_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$existing_release_id"
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          cat > release-notes.md <<EOF
          APK kiểm thử Spatial Object Renderer v2 từ PR #33.

          Source commit: ${SOURCE_SHA}
          Dung lượng: ${APK_BYTES} byte
          SHA-256: ${APK_SHA256}

          Thay đổi chính:
          - direct path là moving mono object thay vì hai kênh stereo cùng một vị trí;
          - Side gốc chỉ còn ambience bed tĩnh nhỏ;
          - cường độ 50% được remap thành chuyển động hiệu dụng rõ hơn;
          - thêm cue trái/phải và cue phổ cho phía sau;
          - reflection send/return có gate và low-pass để giảm tiếng xì;
          - giảm wet room preset, tăng ray count nhưng giảm tần suất cập nhật IR;
          - loudnorm chờ toàn bộ log bất đồng bộ.

          Đây là debug APK để kiểm thử thiết bị, chưa hợp nhất vào main.
          EOF

          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "Spatial Object Renderer PR #33 • latest (${SHORT_SHA})" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
          gh release upload "$TAG" "$APK_NAME" --clobber

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$TAG" --pattern "$APK_NAME" --dir "$verify_dir"
          downloaded_sha="$(sha256sum "$verify_dir/$APK_NAME" | cut -d' ' -f1)"
          test "$downloaded_sha" = "$APK_SHA256"

          {
            echo '## Spatial Object Renderer APK'
            echo
            echo "- Source: $SOURCE_SHA"
            echo "- Asset: $APK_NAME"
            echo "- Bytes: $APK_BYTES"
            echo "- SHA-256: $APK_SHA256"
            echo '- Download verification: passed'
          } | tee -a "$GITHUB_STEP_SUMMARY"
