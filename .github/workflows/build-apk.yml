name: Build app-debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply adaptive QNN fallback patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/demucs-v4-qnn-gpu'
        run: |
          python3 scripts/apply_qnn_resilience.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt \
              app/src/main/java/com/aistudio/mediatool/core/ml/StemModelRegistry.kt \
              app/src/main/java/com/aistudio/mediatool/ui/screens/SettingsScreen.kt \
              scripts/verify_project.py
            git commit -m "feat: add adaptive QNN fallback chain"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify project
        run: python3 scripts/verify_project.py

      # Slow legacy tasks intentionally excluded: assembleInternal, assembleDebugAndroidTest.
      - name: Build app-debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --build-cache

      - name: Inspect app-debug APK
        run: python3 scripts/inspect_apks.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app-debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Lint and unit tests for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace --build-cache

      - name: Upload pull-request reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mediatool-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
