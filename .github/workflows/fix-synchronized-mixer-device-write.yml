name: Fix synchronized mixer device write

on:
  push:
    branches:
      - agent/stem-quality-hardening
    paths:
      - scripts/fix_synchronized_mixer_device_write.py
      - .github/workflows/fix-synchronized-mixer-device-write.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/fix_synchronized_mixer_device_write.py
      - .github/workflows/fix-synchronized-mixer-device-write.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stem-quality-hardening
          fetch-depth: 0

      - name: Apply guarded mixer fix
        run: python3 scripts/fix_synchronized_mixer_device_write.py

      - name: Verify project structure
        run: python3 scripts/verify_project.py

      - name: Commit device fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/mediatool/core/audio/SynchronizedStemMixer.kt
          git diff --cached --check
          git commit -m "Sửa AudioTrack mixer theo diagnostics thiết bị"
          git push origin HEAD:agent/stem-quality-hardening
