name: Apply stem exit diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/stem-exit-fix.patch
      - .github/workflows/apply-stem-exit-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/stem-native-exit-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply patch
        run: |
          git apply --check scripts/stem-exit-fix.patch
          git apply scripts/stem-exit-fix.patch
          rm scripts/stem-exit-fix.patch
          rm .github/workflows/apply-stem-exit-fix.yml

      - name: Verify source
        run: |
          python3 scripts/verify_project.py
          ./scripts/run_core_smoke.sh

      - name: Commit applied patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt \
                  app/src/main/java/com/aistudio/mediatool/core/ml/StemService.kt \
                  scripts/stem-exit-fix.patch \
                  .github/workflows/apply-stem-exit-fix.yml
          git commit -m "fix: reduce stem inference memory and persist exit phase"
          git push origin HEAD:${{ github.head_ref }}
