name: Apply stem quality stage A

on:
  push:
    branches:
      - agent/stem-quality-hardening
    paths:
      - scripts/apply_stem_quality_stage_a.py
      - .github/workflows/apply-stem-quality-stage-a.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_stem_quality_stage_a.py
      - .github/workflows/apply-stem-quality-stage-a.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stem-quality-hardening
          fetch-depth: 0

      - name: Tighten five-command replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_stem_quality_stage_a.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt",
              ' $trimArgs $encodingArgs ',
              ' $outputFilterArgs $encodingArgs ',
          )
          # Four more trimArgs occurrences.
          for _ in range(4):
              replace_once(
                  "app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt",
                  ' $trimArgs $encodingArgs ',
                  ' $outputFilterArgs $encodingArgs ',
              )
          '''
          new = '''target = ROOT / "app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt"
          text = target.read_text(encoding="utf-8")
          old_encoding = ' $trimArgs $encodingArgs '
          if text.count(old_encoding) != 5:
              raise RuntimeError(f"Expected five stem encoding filters, found {text.count(old_encoding)}")
          target.write_text(text.replace(old_encoding, ' $outputFilterArgs $encodingArgs '), encoding="utf-8")
          '''
          if text.count(old) != 1:
              raise SystemExit('Could not locate guarded five-command replacement')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply guarded patch
        run: python3 scripts/apply_stem_quality_stage_a.py

      - name: Verify project structure
        run: python3 scripts/verify_project.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git diff --cached --check
          git commit -m "Gia cố chất lượng pipeline tách nhạc"
          git push origin HEAD:agent/stem-quality-hardening
