name: Apply and validate Spatial room presence v3

on:
  pull_request:
    branches: [agent/spatial-object-renderer-v2]

permissions:
  contents: write

concurrency:
  group: spatial-room-presence-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-build-test-publish:
    if: github.event.pull_request.head.ref == 'agent/spatial-room-presence-front-back-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout room-presence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic room-presence patch
        run: python3 scripts/patch_spatial_room_presence_v3.py

      - name: Verify architecture markers
        run: |
          grep -q 'renderEarlyReflectionBlock' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'kRearNotchDepth = 0.62f' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'roomPresence = value.friendlyReflectionPosition()' app/src/main/java/com/aistudio/mediatool/core/spatial/SteamAudioBridge.kt
          grep -q 'REFLECTION_CURVE_EXPONENT = 1.25f' app/src/main/java/com/aistudio/mediatool/core/spatial/SpatialAudioConfig.kt
          grep -q 'maxReflectionWet = 0.34f' app/src/main/java/com/aistudio/mediatool/core/spatial/SpatialRoomPreset.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build, lint and unit test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace --build-cache

      - name: Inspect and verify APK
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          python3 scripts/inspect_apks.py "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Commit validated application changes
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/test
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Strengthen clean room presence and front back cues'
            git push origin "HEAD:$BRANCH"
          fi

      - name: Publish verified Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          TAG="spatial-room-presence-pr${PR_NUMBER}-latest"
          APK_NAME="MediaTool-spatial-room-presence-pr${PR_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          APK_BYTES="$(stat -c '%s' "$APK_NAME")"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"

          existing_release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$existing_release_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$existing_release_id"
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          cat > release-notes.md <<EOF
          APK kiểm thử Room Presence + Front/Back v3 từ PR #${PR_NUMBER}.

          Source commit: ${SOURCE_SHA}
          Dung lượng: ${APK_BYTES} byte
          SHA-256: ${APK_SHA256}

          Thay đổi chính:
          - tăng dải hữu dụng của thanh Phản xạ phòng;
          - thêm early reflections sạch dựa trên kích thước phòng;
          - giữ low-pass và gate cho late ray-traced reflections để tránh tiếng xì;
          - thêm front presence shelf và rear pinna notch;
          - tăng rear wet cue nhưng vẫn giữ limiter -1 dBFS.

          Đây là debug APK để kiểm thử thiết bị, chưa merge.
          EOF

          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "Room Presence + Front Back PR #${PR_NUMBER} • latest (${SHORT_SHA})" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
          gh release upload "$TAG" "$APK_NAME" --clobber

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$TAG" --pattern "$APK_NAME" --dir "$verify_dir"
          downloaded_sha="$(sha256sum "$verify_dir/$APK_NAME" | cut -d' ' -f1)"
          test "$downloaded_sha" = "$APK_SHA256"

          {
            echo '## Spatial Room Presence v3 APK'
            echo
            echo "- Source: $SOURCE_SHA"
            echo "- Asset: $APK_NAME"
            echo "- Bytes: $APK_BYTES"
            echo "- SHA-256: $APK_SHA256"
            echo '- Download verification: passed'
          } | tee -a "$GITHUB_STEP_SUMMARY"
