name: Apply model-specific QNN backend

on:
  push:
    branches: [agent/demucs-v4-qnn-gpu]
    paths:
      - scripts/force_qnn_model_backend.py
      - .github/workflows/force-qnn-model-backend.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/demucs-v4-qnn-gpu
          fetch-depth: 0

      - name: Apply backend lock
        run: python3 scripts/force_qnn_model_backend.py

      - name: Commit backend lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: force QNN model onto QNN GPU"
          git push origin HEAD:agent/demucs-v4-qnn-gpu
