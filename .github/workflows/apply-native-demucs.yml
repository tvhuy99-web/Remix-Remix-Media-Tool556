name: Apply native Demucs migration

on:
  push:
    branches:
      - agent/native-demucs-v4

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-demucs-v4
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/apply_native_demucs_migration.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace ONNX stems with native Demucs v4"
          git push origin HEAD:agent/native-demucs-v4
