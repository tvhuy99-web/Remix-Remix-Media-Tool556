name: Probe MossFormer2 model

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and fingerprint MossFormer2 ONNX
        shell: bash
        run: |
          set -euo pipefail
          URL='https://huggingface.co/TigreGotico/audiosronnx-mossformer2/resolve/main/mossformer2_48k.onnx?download=true'
          curl --fail --location --retry 5 --retry-all-errors --dump-header headers.txt "$URL" --output mossformer2_48k.onnx
          echo "MODEL_BYTES=$(stat -c %s mossformer2_48k.onnx)"
          echo "MODEL_SHA256=$(sha256sum mossformer2_48k.onnx | cut -d' ' -f1)"
          echo "HF_REPO_COMMIT=$(tr -d '\r' < headers.txt | awk -F': ' 'tolower($1)=="x-repo-commit" {print $2}' | tail -1)"
          test "$(stat -c %s mossformer2_48k.onnx)" -gt 200000000
