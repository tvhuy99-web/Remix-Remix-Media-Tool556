name: Apply effect stability fixes

on:
  push:
    branches:
      - agent/effect-stability-fixes

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/effect-stability-fixes
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded source patch
        run: |
          python3 .github/scripts/patch_effect_stability.py
          python3 - <<'PY'
          from pathlib import Path

          rules = Path('app/src/main/java/com/aistudio/mediatool/core/media/MediaEffectRules.kt')
          text = rules.read_text(encoding='utf-8')
          text = text.replace('MediaAudioEffect.EQUALIZER,\n        -> true', 'MediaAudioEffect.EQUALIZER -> true')
          text = text.replace('MediaAudioEffect.COMPRESSOR,\n        -> false', 'MediaAudioEffect.COMPRESSOR -> false')
          text = text.replace('pitch.takeIf(Float::isFinite)', 'pitch.takeIf { it.isFinite() }')
          text = text.replace('speed.takeIf(Float::isFinite)', 'speed.takeIf { it.isFinite() }')
          text = text.replace('value.takeIf(Float::isFinite)', 'value.takeIf { it.isFinite() }')
          text = text.replace('String.format(Locale.US, ".${decimals}f", value)', 'String.format(Locale.US, "%.${decimals}f", value)')
          rules.write_text(text, encoding='utf-8')

          tests = Path('app/src/test/java/com/aistudio/mediatool/core/media/MediaEffectRulesTest.kt')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace('contains("0.0010")', 'contains("0.0150")')
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify patch shape
        run: |
          grep -q 'MediaEffectRules.speedPitchFilters' app/src/main/java/com/aistudio/mediatool/ui/screens/OtherScreen.kt
          grep -q 'afftdn=nr=' app/src/main/java/com/aistudio/mediatool/core/media/MediaEffectRules.kt
          grep -q 'appendFinalLoudnessFilters' app/src/main/java/com/aistudio/mediatool/ui/screens/OtherScreen.kt
          git diff --check

      - name: Run unit tests, lint and APK build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Remove transient patch automation
        run: |
          rm -f .github/scripts/patch_effect_stability.py
          rm -f .github/workflows/effect-stability-patch.yml
          rmdir .github/scripts 2>/dev/null || true

      - name: Commit validated fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aistudio/mediatool/ui/screens/OtherScreen.kt
          git add app/src/main/java/com/aistudio/mediatool/core/media/MediaEffectRules.kt
          git add app/src/test/java/com/aistudio/mediatool/core/media/MediaEffectRulesTest.kt
          git add -u .github
          git commit -m 'fix: stabilize media effect filters'
          git push origin HEAD:agent/effect-stability-fixes
