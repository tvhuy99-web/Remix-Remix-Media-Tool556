name: Publish Spatial hardening APK

on:
  pull_request:
    branches: [agent/room-aware-spatial-audio-phase-1c]

permissions:
  contents: write

concurrency:
  group: spatial-hardening-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-apk:
    if: github.event.pull_request.head.ref == 'agent/room-aware-spatial-audio-hardening-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout hardening source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build hardening APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --build-cache

      - name: Inspect and verify APK
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          python3 scripts/inspect_apks.py "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Publish one verified Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          TAG='room-aware-hardening-pr32-latest'
          APK_NAME='MediaTool-room-aware-hardening-pr32.apk'
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          APK_BYTES="$(stat -c '%s' "$APK_NAME")"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"

          existing_release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$existing_release_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$existing_release_id"
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          cat > release-notes.md <<EOF
          APK kiểm thử Giai đoạn 1C.2 từ PR #32.

          Source commit: ${SOURCE_SHA}
          Dung lượng: ${APK_BYTES} byte
          SHA-256: ${APK_SHA256}

          Bản này gồm:
          - quỹ đạo được co đồng đều theo kích thước phòng;
          - loudnorm capture/parser ổn định trong release build;
          - reflection bus có headroom 3 dB;
          - bảo toàn tối thiểu 22% Side cho nguồn stereo thật;
          - pre-filter xung đột bị chặn;
          - tail policy và preview 10 giây được chuẩn hóa.

          Đây là debug APK để kiểm thử thiết bị, chưa hợp nhất vào main.
          EOF

          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "Room-aware hardening PR #32 • latest (${SHORT_SHA})" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
          gh release upload "$TAG" "$APK_NAME" --clobber

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$TAG" --pattern "$APK_NAME" --dir "$verify_dir"
          downloaded_sha="$(sha256sum "$verify_dir/$APK_NAME" | cut -d' ' -f1)"
          test "$downloaded_sha" = "$APK_SHA256"

          {
            echo '## Spatial hardening APK'
            echo
            echo "- Source: $SOURCE_SHA"
            echo "- Asset: $APK_NAME"
            echo "- Bytes: $APK_BYTES"
            echo "- SHA-256: $APK_SHA256"
            echo '- Download verification: passed'
          } | tee -a "$GITHUB_STEP_SUMMARY"
