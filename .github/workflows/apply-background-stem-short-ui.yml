name: Apply background stem and short UI patch

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/background-stem-short-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply checked transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          manifest = "app/src/main/AndroidManifest.xml"
          replace_once(
              manifest,
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n',
          )

          service = "app/src/main/java/com/aistudio/mediatool/core/ml/StemService.kt"
          replace_once(
              service,
              'import android.os.IBinder\n',
              'import android.os.IBinder\nimport android.os.PowerManager\n',
          )
          replace_once(
              service,
              '    private var currentTaskId: String? = null\n    @Volatile private var stopping = false\n',
              '    private var currentTaskId: String? = null\n'
              '    private var processingWakeLock: PowerManager.WakeLock? = null\n'
              '    @Volatile private var stopping = false\n',
          )
          replace_once(
              service,
              '        try {\n            startAsForeground()\n        } catch (error: Exception) {\n',
              '        try {\n            startAsForeground()\n            acquireProcessingWakeLock()\n        } catch (error: Exception) {\n',
          )
          replace_once(
              service,
              '    private fun finishService() {\n        currentTaskId?.let { taskId -> ProcessExitDiagnostics.finish(this, TASK_TYPE, taskId) }\n',
              '''    private fun acquireProcessingWakeLock() {
        if (processingWakeLock?.isHeld == true) return
        val lock = getSystemService(PowerManager::class.java).newWakeLock(
            PowerManager.PARTIAL_WAKE_LOCK,
            "$packageName:StemProcessing",
        ).apply {
            setReferenceCounted(false)
            acquire(WAKE_LOCK_TIMEOUT_MS)
        }
        processingWakeLock = lock
        DiagnosticLogger.info(
            component = "StemService",
            event = "wake_lock_acquired",
            sessionId = currentTaskId,
            fields = mapOf("timeout_ms" to WAKE_LOCK_TIMEOUT_MS),
        )
    }

    private fun releaseProcessingWakeLock(reason: String) {
        val lock = processingWakeLock ?: return
        processingWakeLock = null
        val wasHeld = runCatching { lock.isHeld }.getOrDefault(false)
        if (wasHeld) runCatching { lock.release() }
        DiagnosticLogger.info(
            component = "StemService",
            event = "wake_lock_released",
            sessionId = currentTaskId,
            fields = mapOf("held" to wasHeld, "reason" to reason),
        )
    }

    private fun finishService() {
        releaseProcessingWakeLock("finish")
        currentTaskId?.let { taskId -> ProcessExitDiagnostics.finish(this, TASK_TYPE, taskId) }
''',
          )
          replace_once(
              service,
              '            .setContentTitle("Tách nhạc bằng AI")\n            .setContentText("Đang chuẩn bị model và âm thanh")\n',
              '            .setContentTitle("Tách nhạc")\n            .setContentText("Đang chuẩn bị")\n',
          )
          replace_once(
              service,
              '            .setContentTitle("Tách nhạc bằng AI")\n            .setContentText("Đang xử lý: ${progress.coerceIn(0, 100)}%")\n',
              '            .setContentTitle("Tách nhạc")\n            .setContentText("${progress.coerceIn(0, 100)}%")\n',
          )
          replace_once(
              service,
              '        separator?.cancel()\n        processingJob?.cancel()\n        serviceScope.cancel()\n',
              '        separator?.cancel()\n        processingJob?.cancel()\n        releaseProcessingWakeLock("destroy")\n        serviceScope.cancel()\n',
          )
          replace_once(
              service,
              '                NotificationChannel(CHANNEL_ID, "Xử lý AI", NotificationManager.IMPORTANCE_LOW),\n',
              '                NotificationChannel(CHANNEL_ID, "Tách nhạc", NotificationManager.IMPORTANCE_LOW),\n',
          )
          replace_once(
              service,
              '        private const val MAX_DURATION_MS = 3L * 60L * 60L * 1_000L\n',
              '        private const val MAX_DURATION_MS = 3L * 60L * 60L * 1_000L\n'
              '        private const val WAKE_LOCK_TIMEOUT_MS = 6L * 60L * 60L * 1_000L\n',
          )

          main = "app/src/main/java/com/aistudio/mediatool/ui/screens/MainScreen.kt"
          replace_once(
              main,
              '''private data class ToolEntry(
    val title: String,
    val description: String,
    val icon: ImageVector,
    val action: () -> Unit,
)
''',
              '''private data class ToolEntry(
    val title: String,
    val icon: ImageVector,
    val action: () -> Unit,
)
''',
          )
          replace_once(
              main,
              '''        ToolEntry("Ghi âm", "Microphone hoặc âm thanh hệ thống", Icons.Default.Mic, onNavigateToRecord),
        ToolEntry("Cắt media", "Cắt một hoặc nhiều đoạn audio/video", Icons.Default.ContentCut, onNavigateToTrim),
        ToolEntry("Nối audio", "Nối nhiều tệp theo thứ tự đã chọn", Icons.Default.Add, onNavigateToJoin),
        ToolEntry("Trộn nhiều luồng", "Ghép nhạc nền, pan và tự động ducking", Icons.Default.MusicNote, onNavigateToMix),
        ToolEntry("Hiệu ứng và trích xuất", "Đổi định dạng, lọc âm, nén video, lấy ảnh", Icons.Default.Tune, onNavigateToOther),
        ToolEntry("Tạo video từ ảnh", "Ghép ảnh và âm thanh thành video MP4", Icons.Default.Image, onNavigateToImg2Vid),
        ToolEntry("Phụ đề", "Trích xuất SRT và đọc phụ đề bằng TTS", Icons.Default.Subtitles, onNavigateToSub),
        ToolEntry("Tách nhạc bằng AI", "Tách lời, nhạc nền hoặc bốn stem trên máy", Icons.Default.GraphicEq, onNavigateToStem),
''',
              '''        ToolEntry("Ghi âm", Icons.Default.Mic, onNavigateToRecord),
        ToolEntry("Cắt", Icons.Default.ContentCut, onNavigateToTrim),
        ToolEntry("Nối audio", Icons.Default.Add, onNavigateToJoin),
        ToolEntry("Trộn audio", Icons.Default.MusicNote, onNavigateToMix),
        ToolEntry("Công cụ khác", Icons.Default.Tune, onNavigateToOther),
        ToolEntry("Tạo video", Icons.Default.Image, onNavigateToImg2Vid),
        ToolEntry("Phụ đề", Icons.Default.Subtitles, onNavigateToSub),
        ToolEntry("Tách nhạc", Icons.Default.GraphicEq, onNavigateToStem),
''',
          )
          replace_once(
              main,
              '''                title = {
                    Column {
                        Text("MediaTool", fontWeight = FontWeight.Bold)
                        Text(
                            "Xử lý audio và video trên thiết bị",
                            style = MaterialTheme.typography.labelMedium,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                        )
                    }
                },
''',
              '''                title = { Text("MediaTool", fontWeight = FontWeight.Bold) },
''',
          )
          replace_once(
              main,
              '''                    Column(modifier = Modifier.weight(1f)) {
                        Text("Cài đặt", fontWeight = FontWeight.SemiBold)
                        Text(
                            "Định dạng, chất lượng và cấu hình xử lý AI",
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSecondaryContainer,
                        )
                    }
''',
              '''                    Text("Cài đặt", fontWeight = FontWeight.SemiBold)
''',
          )
          replace_once(
              main,
              '''            Column(modifier = Modifier.weight(1f)) {
                Text(tool.title, fontWeight = FontWeight.SemiBold)
                Text(
                    tool.description,
                    style = MaterialTheme.typography.bodySmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant,
                )
            }
''',
              '''            Text(tool.title, fontWeight = FontWeight.SemiBold)
''',
          )

          stem = "app/src/main/java/com/aistudio/mediatool/ui/screens/StemScreen.kt"
          replace_once(stem, '        title = "Tách giọng và nhạc",\n', '        title = "Tách nhạc",\n')
          replace_once(stem, '    Text("Đang tách nhạc trong nền")\n', '    Text("Đang tách nhạc")\n')

          print("Applied wake lock and concise UI transformations")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml \
                  app/src/main/java/com/aistudio/mediatool/core/ml/StemService.kt \
                  app/src/main/java/com/aistudio/mediatool/ui/screens/MainScreen.kt \
                  app/src/main/java/com/aistudio/mediatool/ui/screens/StemScreen.kt
          git diff --cached --check
          git commit -m "fix: keep stem processing active in background"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
