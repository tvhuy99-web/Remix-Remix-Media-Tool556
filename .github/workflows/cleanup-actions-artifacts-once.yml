name: Cleanup Actions Artifacts Once

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.head_ref == 'agent/spatial-audio-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete all existing Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t artifacts < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | "\(.id)\t\(.size_in_bytes)\t\(.name)\t\(.created_at)"'
          )

          count=${#artifacts[@]}
          bytes=0
          echo "Found ${count} artifact(s)."

          for artifact in "${artifacts[@]}"; do
            IFS=$'\t' read -r id size name created_at <<< "$artifact"
            echo "Deleting artifact id=${id}, name=${name}, bytes=${size}, created=${created_at}"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            bytes=$((bytes + size))
          done

          remaining="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" \
            --jq '.total_count')"

          echo "Deleted ${count} artifact(s), ${bytes} byte(s)."
          echo "Remaining artifacts: ${remaining}."
          test "$remaining" -eq 0
