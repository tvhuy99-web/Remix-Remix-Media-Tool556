name: Apply MDX23C bundled fix

on:
  push:
    branches:
      - agent/mdx23c-vocal-onnx
    paths:
      - scripts/apply_mdx23c_bundled_fix.py
      - .github/workflows/apply-mdx23c-bundled-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mdx23c-vocal-onnx
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_mdx23c_bundled_fix.py

      - name: Verify generated source
        run: python3 scripts/verify_project.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/build-mdx23c-bundled-apk.yml
          git diff --cached --check
          git commit -m "Sửa tên và đóng gói MDX23C trong APK"
          git push origin HEAD:agent/mdx23c-vocal-onnx
