name: Apply MDX23C phase 1

on:
  push:
    branches:
      - agent/mdx23c-vocal-onnx
    paths:
      - scripts/apply_mdx23c_audio_pipeline.py
      - .github/workflows/apply-mdx23c-phase1.yml

permissions:
  contents: write

concurrency:
  group: apply-mdx23c-phase1
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: agent/mdx23c-vocal-onnx
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply guarded audio-pipeline changes
        run: python3 scripts/apply_mdx23c_audio_pipeline.py

      - name: Verify project structure
        run: python3 scripts/verify_project.py

      - name: Run unit tests and compile debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit phase 1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/mediatool/core/ml/MdxAudioSeparator.kt \
                  app/src/test/java/com/aistudio/mediatool/core/ml/MdxOverlapAddWriterTest.kt
          git diff --cached --check
          git commit -m "Hoàn thiện pipeline audio MDX23C"
          git push origin HEAD:agent/mdx23c-vocal-onnx
