name: Import MediaTool source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch source project
        run: |
          git clone --depth=1 https://github.com/tvhuy99-web/ac-Google-AI-Studio.git /tmp/mediatool-source

      - name: Generate official Gradle 8.13 wrapper
        run: |
          mkdir -p /tmp/wrapper-project
          printf 'tasks.register("noop")\n' > /tmp/wrapper-project/build.gradle
          gradle -p /tmp/wrapper-project wrapper --gradle-version 8.13 --distribution-type bin

          cp /tmp/wrapper-project/gradlew /tmp/mediatool-source/gradlew
          cp /tmp/wrapper-project/gradlew.bat /tmp/mediatool-source/gradlew.bat
          mkdir -p /tmp/mediatool-source/gradle/wrapper
          cp /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.jar /tmp/mediatool-source/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.properties /tmp/mediatool-source/gradle/wrapper/gradle-wrapper.properties

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/mediatool-source/gradle/wrapper/gradle-wrapper.properties')
          checksum = '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78'
          lines = [
              line for line in path.read_text(encoding='utf-8').splitlines()
              if not line.startswith('distributionSha256Sum=')
          ]
          insert_at = next(
              (index + 1 for index, line in enumerate(lines) if line.startswith('distributionUrl=')),
              len(lines),
          )
          lines.insert(insert_at, f'distributionSha256Sum={checksum}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          chmod +x /tmp/mediatool-source/gradlew
          find /tmp/mediatool-source/scripts -maxdepth 1 -type f -name '*.sh' -exec chmod +x {} +

      - name: Patch imported project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/mediatool-source/.github/workflows/build-apk.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              '      - name: Build instrumentation APK\n        run: ./gradlew assembleDebugAndroidTest --stacktrace\n',
              '      - name: Build instrumentation APK\n        run: |\n          chmod +x gradlew\n          ./gradlew assembleDebugAndroidTest --stacktrace\n',
          )
          text = text.replace('validate-wrappers: false', 'validate-wrappers: true')
          workflow.write_text(text, encoding='utf-8', newline='\n')
          PY

          cat > /tmp/mediatool-source/scripts/test_wrapper_bootstrap.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def main() -> None:
              with tempfile.TemporaryDirectory(prefix="mediatool-wrapper-") as raw:
                  temp = Path(raw)
                  project = temp / "project"
                  gradle_home = temp / "gradle-home"
                  (project / "gradle/wrapper").mkdir(parents=True)

                  for relative in (
                      "gradlew",
                      "gradle/wrapper/gradle-wrapper.jar",
                      "gradle/wrapper/gradle-wrapper.properties",
                  ):
                      source = ROOT / relative
                      destination = project / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, destination)

                  (project / "gradlew").chmod(0o755)
                  (project / "settings.gradle.kts").write_text(
                      'rootProject.name = "wrapper-smoke"\n',
                      encoding="utf-8",
                  )

                  env = os.environ.copy()
                  env["GRADLE_USER_HOME"] = str(gradle_home)
                  result = subprocess.run(
                      [str(project / "gradlew"), "--version"],
                      cwd=project,
                      env=env,
                      text=True,
                      capture_output=True,
                      timeout=300,
                  )
                  output = result.stdout + "\n" + result.stderr
                  if result.returncode != 0:
                      raise SystemExit(
                          "WRAPPER TEST FAILED\n"
                          f"STDOUT:\n{result.stdout}\nSTDERR:\n{result.stderr}"
                      )
                  if "Gradle 8.13" not in output:
                      raise SystemExit(
                          "WRAPPER TEST FAILED: expected Gradle 8.13\n"
                          f"OUTPUT:\n{output}"
                      )
                  print("WRAPPER BOOTSTRAP OK")


          if __name__ == "__main__":
              main()
          PY
          chmod +x /tmp/mediatool-source/scripts/test_wrapper_bootstrap.py

          cat > /tmp/mediatool-source/.gitattributes <<'EOF'
          * text=auto
          gradlew text eol=lf
          gradlew.bat text eol=crlf
          *.sh text eol=lf
          *.yml text eol=lf
          *.yaml text eol=lf
          *.jar binary
          *.zip binary
          *.apk binary
          *.aab binary
          *.webp binary
          *.png binary
          *.jpg binary
          *.jpeg binary
          EOF

      - name: Verify imported source
        working-directory: /tmp/mediatool-source
        run: |
          python3 scripts/verify_project.py
          ./scripts/run_core_smoke.sh
          python3 scripts/test_wrapper_bootstrap.py

      - name: Replace repository contents
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/mediatool-source/ ./
          chmod +x gradlew
          find scripts -maxdepth 1 -type f -name '*.sh' -exec chmod +x {} +

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace repository with MediaTool 1.3.1 source" || exit 0
          git push origin HEAD:main
