name: Apply and validate Spatial hardening

on:
  pull_request:
    branches: [agent/room-aware-spatial-audio-phase-1c]

permissions:
  contents: write

concurrency:
  group: spatial-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-build-test:
    if: github.event.pull_request.head.ref == 'agent/room-aware-spatial-audio-hardening-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic hardening patch
        run: python3 scripts/run_spatial_hardening.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build, lint and unit test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace --build-cache

      - name: Inspect APK native payload
        run: |
          python3 scripts/inspect_apks.py app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libphonon.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libmediatool_spatial.so'

      - name: Commit validated hardening changes
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/test docs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Harden room-aware spatial audio from device diagnostics'
          git push origin "HEAD:$BRANCH"
