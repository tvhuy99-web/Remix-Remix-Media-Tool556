name: Apply MDX23C tuning modes

on:
  push:
    branches:
      - agent/mdx23c-vocal-onnx
    paths:
      - scripts/apply_mdx23c_tuning_modes.py
      - .github/workflows/apply-mdx23c-tuning-modes.yml

permissions:
  contents: write

concurrency:
  group: apply-mdx23c-tuning-modes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mdx23c-vocal-onnx
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_mdx23c_tuning_modes.py

      - name: Verify project
        run: python3 scripts/verify_project.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs
          git diff --cached --check
          git commit -m "Thêm chế độ hiệu năng MDX23C"
          git push origin HEAD:agent/mdx23c-vocal-onnx
