name: Export MDX23C personal model

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mdx23c-vocal-onnx
    paths:
      - .github/workflows/export-mdx23c-personal.yml
      - tools/mdx23c/**

permissions:
  contents: write

concurrency:
  group: export-mdx23c-personal
  cancel-in-progress: false

env:
  MSST_COMMIT: e247dfe4abc1f17c69dff719207fe045dc04413a
  CHECKPOINT_SHA256: 49d51472769e34a2501cd1da782346a3212555c3a5619fc2c53507445528d816
  MODEL_FILE: mdx23c-vocals-core.onnx
  RELEASE_TAG: mdx23c-vocal-personal-v1

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout MediaTool
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/mdx23c/requirements.txt

      - name: Install CPU export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch' tools/mdx23c/requirements.txt > /tmp/mdx23c-requirements.txt
          python -m pip install -r /tmp/mdx23c-requirements.txt

      - name: Checkout pinned MSST source
        run: |
          git clone --filter=blob:none https://github.com/ZFTurbo/Music-Source-Separation-Training.git /tmp/msst
          git -C /tmp/msst checkout "$MSST_COMMIT"
          test "$(git -C /tmp/msst rev-parse HEAD)" = "$MSST_COMMIT"

      - name: Download official config and checkpoint
        run: |
          mkdir -p /tmp/mdx23c-input /tmp/mdx23c-output
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/mdx23c-input/config_vocals_mdx23c.yaml \
            https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v1.0.0/config_vocals_mdx23c.yaml
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/mdx23c-input/model_vocals_mdx23c_sdr_10.17.ckpt \
            https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v1.0.0/model_vocals_mdx23c_sdr_10.17.ckpt
          echo "$CHECKPOINT_SHA256  /tmp/mdx23c-input/model_vocals_mdx23c_sdr_10.17.ckpt" | sha256sum --check --strict

      - name: Export spectrogram core and verify parity
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python tools/mdx23c/export_vocal_core_onnx.py \
            --msst-root /tmp/msst \
            --config /tmp/mdx23c-input/config_vocals_mdx23c.yaml \
            --checkpoint /tmp/mdx23c-input/model_vocals_mdx23c_sdr_10.17.ckpt \
            --output "/tmp/mdx23c-output/$MODEL_FILE" \
            --metadata /tmp/mdx23c-output/mdx23c-vocals-core.json \
            | tee /tmp/mdx23c-output/export-report.txt

      - name: Validate Android graph contract
        run: |
          python tools/mdx23c/validate_vocal_core_onnx.py "/tmp/mdx23c-output/$MODEL_FILE" \
            | tee /tmp/mdx23c-output/graph-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('/tmp/mdx23c-output/mdx23c-vocals-core.json').read_text())
          parity = metadata.get('parity') or {}
          assert parity.get('max_abs_error', 1.0) <= 2e-4, parity
          assert metadata['checkpoint_sha256'] == '49d51472769e34a2501cd1da782346a3212555c3a5619fc2c53507445528d816'
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY

      - name: Write personal-use release notice
        run: |
          cat > /tmp/mdx23c-output/NOTICE.md <<'EOF'
          # MDX23C vocal-only personal model

          This artifact is intended for the repository owner's personal, non-commercial use.

          - Architecture and training code: ZFTurbo/Music-Source-Separation-Training
          - Source checkpoint: model_vocals_mdx23c_sdr_10.17.ckpt
          - Original checkpoint SHA-256: 49d51472769e34a2501cd1da782346a3212555c3a5619fc2c53507445528d816
          - Conversion: learned spectrogram core only; STFT/iSTFT and overlap-add stay in MediaTool
          - Contract: float32 [1,4,4096,256] -> float32 [1,4,4096,256]
          - Intended scope: personal and non-commercial use
          EOF

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdx23c-vocal-personal-model
          path: /tmp/mdx23c-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create or update personal model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Personal, non-commercial MDX23C vocal-only artifact for MediaTool.

          The ONNX file contains only the learned spectrogram core. MediaTool performs STFT, iSTFT, 75% overlap-add, reflect padding, residual instrumental reconstruction and quality diagnostics on-device.

          Source checkpoint SHA-256: `49d51472769e34a2501cd1da782346a3212555c3a5619fc2c53507445528d816`.
          See `NOTICE.md` and `mdx23c-vocals-core.json` for attribution, tensor contract and parity results.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" /tmp/mdx23c-output/* --clobber
          else
            gh release create "$RELEASE_TAG" /tmp/mdx23c-output/* \
              --target "$GITHUB_SHA" \
              --title "MDX23C vocal-only personal model" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
