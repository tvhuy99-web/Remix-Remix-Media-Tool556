name: Apply QNN GPU migration

on:
  push:
    branches: [agent/demucs-v4-qnn-gpu]
    paths:
      - scripts/migrate_qnn_gpu.py
      - .github/workflows/migrate-qnn-gpu.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/demucs-v4-qnn-gpu
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/migrate_qnn_gpu.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Demucs v4 QNN GPU prototype"
          git push origin HEAD:agent/demucs-v4-qnn-gpu
