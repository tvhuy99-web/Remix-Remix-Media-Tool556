name: Apply stem runtime compile fix

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fix-stem-runtime-reference.patch
      - .github/workflows/apply-stem-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/stem-native-exit-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply patch
        run: |
          git apply --check scripts/fix-stem-runtime-reference.patch
          git apply scripts/fix-stem-runtime-reference.patch
          rm scripts/fix-stem-runtime-reference.patch
          rm .github/workflows/apply-stem-runtime-fix.yml

      - name: Verify source
        run: |
          python3 scripts/verify_project.py
          ./scripts/run_core_smoke.sh

      - name: Commit compile fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt \
                  scripts/fix-stem-runtime-reference.patch \
                  .github/workflows/apply-stem-runtime-fix.yml
          git commit -m "fix: log memory after inference chunks"
          git push origin HEAD:${{ github.head_ref }}
