name: Apply QNN CPU fallback fix

on:
  push:
    branches:
      - agent/fix-qnn-cpu-fallback
    paths:
      - .github/workflows/apply-qnn-fallback-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch QNN session policy
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt')
          text = path.read_text(encoding='utf-8')

          disable_fallback = '                    addConfigEntry("session.disable_cpu_ep_fallback", "1")\n'
          replacement = (
              '                    // QNN GPU không hỗ trợ toàn bộ graph của model này trên mọi thiết bị.\n'
              '                    // Giữ CPU EP làm fallback để các node còn lại vẫn chạy thay vì lỗi khi mở session.\n'
          )
          if text.count(disable_fallback) != 1:
              raise SystemExit('Không tìm thấy đúng một cấu hình khóa CPU fallback')
          text = text.replace(disable_fallback, replacement, 1)

          old_log = '                            "cpu_fallback_disabled" to true,\n'
          new_log = '                            "cpu_fallback_disabled" to false,\n'
          if text.count(old_log) != 1:
              raise SystemExit('Không tìm thấy đúng một trường log cpu_fallback_disabled=true')
          text = text.replace(old_log, new_log, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify project metadata
        run: python scripts/verify_project.py

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-qnn-fallback-fix.yml
          git add app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt
          git diff --cached --check
          git commit -m "fix: allow CPU fallback for QNN GPU"
          git push origin HEAD:agent/fix-qnn-cpu-fallback
