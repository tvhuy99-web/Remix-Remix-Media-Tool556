name: Apply Spatial Audio production fix

on:
  push:
    branches:
      - agent/spatial-room-production-fix
    paths:
      - scripts/apply_spatial_production_fix.py
      - scripts/fix_spatial_test_threshold.py
      - .github/workflows/apply-spatial-production-fix.yml
  pull_request:
    branches:
      - agent/spatial-room-presence-front-back-v3
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply_spatial_production_fix.py
      - scripts/fix_spatial_test_threshold.py
      - .github/workflows/apply-spatial-production-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/spatial-room-production-fix
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply production tuning
        run: |
          python3 scripts/apply_spatial_production_fix.py
          python3 scripts/fix_spatial_test_threshold.py

      - name: Verify project structure
        run: python3 scripts/verify_project.py

      - name: Run unit tests, lint, and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --build-cache

      - name: Commit verified changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hoàn thiện phản xạ phòng và định vị trước sau"
          git push origin HEAD:agent/spatial-room-production-fix
