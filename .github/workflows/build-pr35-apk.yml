name: Build PR35 payload-contract fix APK

on:
  push:
    branches:
      - build/pr35-apk-4989257

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Report build start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "<!-- pr35-payload-v2-build-start:b449792 --> Đang build lại APK PR #35 sau khi đồng bộ payload phòng Kotlin/C++ lên phiên bản 2. Commit sản phẩm: \`b44979228ff9c74a11418f51c0a8eff3cd76ad3e\`. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout exact product commit
        uses: actions/checkout@v4
        with:
          ref: b44979228ff9c74a11418f51c0a8eff3cd76ad3e
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable CI signing key
        run: |
          mkdir -p .ci
          base64 --decode .ci/mediatool-ci-debug.keystore.b64 > .ci/mediatool-ci-debug.keystore
          keytool -list -v \
            -keystore .ci/mediatool-ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey | tee /tmp/stable-signing-cert.txt
          grep -q 'SHA256:' /tmp/stable-signing-cert.txt

      - name: Verify payload contract source
        run: |
          grep -q 'const val PAYLOAD_VERSION = 2' app/src/main/java/com/aistudio/mediatool/core/spatial/RoomReflectionNativeSpec.kt
          grep -q 'constexpr int kPayloadVersion = 2;' app/src/main/cpp/room_aware_spatial_jni.cpp
          grep -q 'kotlinAndNativeRoomPayloadVersionsStayAligned' app/src/test/java/com/aistudio/mediatool/core/spatial/SpatialProductionTuningSourceTest.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify, test, lint, and build APK
        env:
          GITHUB_SHA: b44979228ff9c74a11418f51c0a8eff3cd76ad3e
          GITHUB_HEAD_REF: agent/spatial-room-production-fix
          GITHUB_REF_NAME: agent/spatial-room-production-fix
        run: |
          chmod +x gradlew
          python3 scripts/verify_project.py
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --build-cache

      - name: Verify APK signature and native payload
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="MediaTool-spatial-room-production-pr35-b449792-stable-signed.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"
          unzip -l "dist/$APK_NAME" | grep -E 'lib/arm64-v8a/(libphonon|libmediatool_spatial)\.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "dist/$APK_NAME" | tee "dist/$APK_NAME.cert.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "dist/$APK_NAME.cert.txt"
          grep -q 'V2 Signer: certificate SHA-256 digest: 14c8ef5fa666b2875bce42e6a18cd0781095ceb1ef627b2194c93bc436a7bac7' "dist/$APK_NAME.cert.txt"

      - name: Publish corrected prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pr35-spatial-room-production-b449792-payload-v2"
          APK_NAME="MediaTool-spatial-room-production-pr35-b449792-stable-signed.apk"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "dist/$APK_NAME" \
            "dist/$APK_NAME.sha256" \
            "dist/$APK_NAME.cert.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target b44979228ff9c74a11418f51c0a8eff3cd76ad3e \
            --title "Spatial Room Production PR #35 • payload v2 fix • b449792" \
            --notes "APK thay thế bản PR #35 trước đó. Sửa lỗi runtime 'Phiên bản payload mô hình phòng không tương thích' bằng cách đồng bộ RoomReflectionNativeSpec.PAYLOAD_VERSION và native kPayloadVersion ở phiên bản 2. Bản được ký bằng khóa CI ổn định của PR #34, đã chạy verify_project, unit tests, lintDebug, assembleDebug, CMake/NDK arm64-v8a và apksigner v2." \
            --prerelease

      - name: Report successful release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pr35-spatial-room-production-b449792-payload-v2"
          APK_NAME="MediaTool-spatial-room-production-pr35-b449792-stable-signed.apk"
          CHECKSUM="$(cut -d ' ' -f1 "dist/$APK_NAME.sha256")"
          cat > /tmp/pr35-payload-v2-comment.md <<EOF
          <!-- pr35-payload-v2-release:b449792 -->
          ## APK PR #35 sửa payload v2 đã sẵn sàng

          - Commit sản phẩm: \`b44979228ff9c74a11418f51c0a8eff3cd76ad3e\`
          - Tệp: \`$APK_NAME\`
          - SHA-256 APK: \`$CHECKSUM\`
          - Chứng thư ký SHA-256: \`14c8ef5fa666b2875bce42e6a18cd0781095ceb1ef627b2194c93bc436a7bac7\`
          - Tải APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME
          - Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG
          - Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Bản này sửa lỗi \`Phiên bản payload mô hình phòng không tương thích\`, giữ chữ ký ổn định của PR #34 và đã qua unit test, lint, build native ARM64 cùng \`apksigner\`.
          EOF
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr35-payload-v2-comment.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "<!-- pr35-payload-v2-build-failed:b449792 --> Build APK sửa payload v2 chưa thành công. Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
