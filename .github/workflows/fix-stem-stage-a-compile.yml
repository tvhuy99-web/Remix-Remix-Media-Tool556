name: Fix stem stage A compile

on:
  push:
    branches:
      - agent/stem-quality-hardening
    paths:
      - scripts/fix_stem_stage_a_compile.py
      - .github/workflows/fix-stem-stage-a-compile.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/fix_stem_stage_a_compile.py
      - .github/workflows/fix-stem-stage-a-compile.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stem-quality-hardening
          fetch-depth: 0

      - name: Apply guarded compile fix
        run: python3 scripts/fix_stem_stage_a_compile.py

      - name: Verify project structure
        run: python3 scripts/verify_project.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/mediatool/core/ml/AudioSeparator.kt
          git diff --cached --check
          git commit -m "Sửa kiểm tra hủy residual Demucs"
          git push origin HEAD:agent/stem-quality-hardening
