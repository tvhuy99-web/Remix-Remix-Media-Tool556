name: Build and test Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify project handoff
        run: python3 scripts/verify_project.py

      - name: Build, lint and unit test
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean lintDebug testDebugUnitTest assembleDebug assembleInternal --stacktrace

      - name: Inspect APK contents
        run: python3 scripts/inspect_apks.py $(find app/build/outputs/apk -name '*.apk' -type f)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mediatool-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/internal/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediatool-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  instrumentation-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build instrumentation APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediatool-instrumentation-reports
          path: |
            app/build/outputs/apk/androidTest/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14
